name: sub_guard
description: "Subscription manager and tracker."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^18.0.0

  # Networking
  dio: ^5.7.0

  # Local Database
  hive_ce: ^2.1.0
  hive_ce_flutter: ^2.1.0

  # Utilities
  uuid: ^4.5.1
  timezone: ^0.11.1
  intl: ^0.20.2
  url_launcher: ^6.3.1
  logger: ^2.5.0
  connectivity_plus: ^7.3.1
  package_info_plus: ^10.2.1
  path_provider: ^2.1.4
  csv: ^8.0.0
  excel: ^4.0.6
  home_widget: ^0.7.0

  # Secure Storage
  flutter_secure_storage: ^11.0.0

  # Firebase
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.0
  cloud_firestore: ^6.9.0
  firebase_messaging: ^16.6.0
  firebase_crashlytics: ^5.3.0
  firebase_analytics: ^12.5.0

  # Authentication
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^8.1.0

  # Notifications
  flutter_local_notifications: ^22.3.0

  # Background Service
  flutter_background_service: ^5.1.0

  # Charts
  fl_chart: ^1.2.0

  # Image Caching
  cached_network_image: ^3.4.1

  # Loading States
  shimmer: ^4.0.0

  # Local Authentication
  local_auth: ^3.0.2

  # Sharing / Files
  share_plus: ^13.3.0
  file_picker: ^12.0.0

  # Email API
  googleapis: ^17.0.0
  googleapis_auth: ^2.3.3

  # Payments
  in_app_purchase: ^3.2.0
  flutter_stripe: ^14.0.0

  # Serialization
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Additional
  equatable: ^2.0.7
  dartz: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  analyzer: ^7.7.1
  # Code Generation
  build_runner: ^2.5.4
  freezed: ^3.1.0
  json_serializable: ^6.9.5
  source_gen: ^2.0.0
  # Testing
  mockito: ^5.4.4
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/logos/
